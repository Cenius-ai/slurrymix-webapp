[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurrymix"
version = "1.0.0"
description = "Manure slurry ratio calculator, spread rotation planner and storage capacity tracker (metric, standard library only)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Slurrymix" }]
keywords = ["slurry", "manure", "nitrogen", "agriculture", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Agriculture",
]
dependencies = []

[project.scripts]
slurrymix = "slurrymix:main"

[tool.setuptools]
py-modules = ["slurrymix"]
